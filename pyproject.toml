[project]
name = "sentiment_analyse"
version = "0.1.0"
description = "智能舆情分析平台：多源监测 + 多智能体研判"
readme = "README.md"
requires-python = ">=3.11"

# 核心运行时依赖：T-01 骨架与接入层所需
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "sse-starlette>=2.1",
    "SQLAlchemy>=2.0",
    "aiomysql>=0.2",
]

# 按任务分工的依赖组：避免一次性拉取完整重依赖（如 torch）
# 安装示例： uv sync --extra agents --extra analytics
[project.optional-dependencies]
agents = ["langgraph>=0.2", "langchain>=0.3", "langchain-openai>=0.2"]
analytics = ["jieba>=0.42", "numpy>=1.26", "scikit-learn>=1.5"]
embeddings = ["sentence-transformers>=3.0"]
vector = ["pymilvus>=2.4"]
multimodal = ["mcp>=1.0"]
auth = ["passlib[bcrypt]>=1.7", "itsdangerous>=2.2"]
report = ["mistune>=3.0"]

[tool.uv]
package = false

# 国内镜像优先：避免依赖下载受网络影响
[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
