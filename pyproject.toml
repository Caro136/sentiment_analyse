[project]
name = "sentiment_analyse"
version = "0.1.0"
description = "智能舆情分析平台：多源监测 + 多智能体研判"
readme = "README.md"
requires-python = ">=3.11"

# 核心运行时依赖：T-01 骨架与接入层所需
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "sse-starlette>=2.1",
    "sqlalchemy[asyncio]>=2.0",   # asyncio extra 会带入 greenlet，异步 session 必需
    "aiomysql>=0.2",
]

# 按任务分工的依赖组：避免一次性拉取完整重依赖（如 torch）
# 安装示例： uv sync --extra agents --extra analytics
[project.optional-dependencies]
# T-04 模型客户端（OpenAI 兼容协议）。agents 组会连带安装它。
# httpx 用于公域搜索适配器直连各家搜索 API（langchain-openai 虽会传递带入，
# 但直接使用它就该显式声明，避免上游换实现时被动断掉）。
llm = ["langchain-openai>=0.2", "httpx>=0.27"]
agents = ["langgraph>=0.2", "langchain>=0.3", "langchain-openai>=0.2"]
analytics = ["numpy>=1.26", "scikit-learn>=1.5"]
# 关键词提取（词云）。单独成组：jieba 只有源码包，
# 清华镜像对其返回 403，装它需要临时换源（见 README）。
keywords = ["jieba>=0.42"]
embeddings = ["sentence-transformers>=3.0"]
vector = ["pymilvus>=2.4"]
multimodal = ["mcp>=1.0"]
# T-19 认证。口令哈希用标准库 hashlib.scrypt（设计规格 8.1 的备选方案）：
# 实测 passlib 1.7.4 读不到 bcrypt 5.x 的版本号，且 bcrypt 5.0 对 >72 字节的口令
# 直接抛 ValueError，连普通口令都哈希不了；scrypt 无长度上限也没有第三方依赖。
# 因此这里只需要会话票据的签名库。
auth = ["itsdangerous>=2.2"]
report = ["mistune>=3.0"]

[tool.uv]
package = false

# 国内镜像优先：避免依赖下载受网络影响。
# 用阿里云而非清华：清华镜像对部分源码包（如 jieba）返回 403 Forbidden，
# 且解析锁文件时会因某个 extra 的依赖失败而整体失败。
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
